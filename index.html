    // ============================================================================

              </div>
              <nav class="hidden lg:flex items-center gap-6 text-sm font-medium opacity-90">

                <a href="#polni" class="hover:underline">Polní výroba & Pila</a>

                <a href="tel:${FARM.eva.phoneRaw}" class="text-xs font-bold px-3 py-2 rounded-lg border border-current/20 hover:opacity-80">

            </div>
          </section>

          <!-- 1. DVA SAMOSTATNÉ SUBJEKTY (Transparentní pro SZIF i zákazníky) -->
          <section id="subjekty" class="max-w-6xl mx-auto px-4 py-16">

            <div class="grid md:grid-cols-2 gap-8">
              <!-- Karta 1: Ing. David Filip -->
              <div class="${d.card} flex flex-col justify-between">

                  <div class="flex flex-wrap justify-between items-center gap-2 mb-4">

                    <span class="font-mono text-xs font-bold opacity-75">IČO: ${FARM.david.ico}</span>

                <div class="flex flex-wrap gap-3">

              <!-- Karta 2: Bc. Eva Pitelková -->

              </div>
              <div class="text-xs opacity-80">
                Výdejní místa po telefonické domluvě: <strong>Rovná 68</strong> (${FARM.eva.name}) nebo <strong>Strunkovice nad Volyňkou 33</strong> (${FARM.david.name})
              </div>
            </div>

            <!-- 4 karty odrůd česneku -->

                <a href="tel:${FARM.eva.phoneRaw}" class="inline-block text-xs font-bold underline">

                </p>

                <div class="flex flex-wrap gap-3">
                  <a href="tel:${FARM.david.phoneRaw}" class="${isLightPacht ? 'bg-black text-white' : 'bg-white text-stone-950'} font-bold text-xs sm:text-sm px-5 py-3 rounded-xl">

              Rychlá navigace vpravo: Česnek • Polní výroba • Pila • Pacht půdy • Mapy
            </div>
          </aside>

          <!-- Pravá obsahová část (8 sloupců) -->
          <div class="lg:col-span-8 xl:col-span-9 p-6 sm:p-12 space-y-12">
            <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
              <span class="text-xs font-bold uppercase text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">Pošumaví & Strakonicko</span>
              <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mt-3">Sezónní prodej ze dvora a polní výroba</h1>
              <p class="text-slate-600 text-sm sm:text-base mt-2 leading-relaxed">
                V levém panelu najdete přímé kontakty na oba naše samostatné podniky. Níže si prohlédněte kompletní přehled pěstovaných odrůd českého česneku, polních komodit, pilařské výroby a přesné mapy obou lokalit.
              </p>
            </div>

            <!-- 4 odrůdy česneku -->
            <div>
              <h2 class="text-2xl font-extrabold text-slate-900 mb-4">🧄 Pravý český ozimý česnek (4 odrůdy)</h2>
              <div class="grid sm:grid-cols-2 gap-4">
                ${FARM.garlic.map(g => `
                  <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                      <strong class="text-lg font-bold text-slate-900">${g.name}</strong>
                      <span class="text-xs font-bold bg-emerald-100 text-emerald-900 px-2.5 py-0.5 rounded-full">${g.badge}</span>
                    </div>
                    <p class="text-xs font-semibold text-slate-500 mb-2">${g.cloves}</p>
                    <p class="text-xs text-slate-600 leading-relaxed">${g.desc}</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Ostatní výroba a Pacht -->
            <div class="grid md:grid-cols-2 gap-6">
              <div class="bg-white p-6 rounded-2xl border border-slate-200">
                <h3 class="font-bold text-slate-900 text-lg mb-2">Levandule, jahody & zelenina (${FARM.eva.name})</h3>
                <p class="text-xs text-slate-600 leading-relaxed">
                  Pěstování v <strong>${FARM.eva.cadastral}</strong> na parcele <strong>${FARM.eva.gps}</strong> se zázemím v <strong>${FARM.eva.address}</strong>.
                </p>
              </div>
              <div class="bg-white p-6 rounded-2xl border border-slate-200">
                <h3 class="font-bold text-slate-900 text-lg mb-2">Obiloviny, řepka, ovce & Pila (${FARM.david.name})</h3>
                <p class="text-xs text-slate-600 leading-relaxed">
                  Polní a živočišná výroba v <strong>${FARM.david.cadastral}</strong> a pořez dřeva ve <strong>${FARM.david.address}</strong>.
                </p>
              </div>
            </div>

            <!-- Mapy -->
            <div class="grid md:grid-cols-2 gap-6">
              <div class="bg-white p-5 rounded-2xl border border-slate-200">
                <p class="text-xs font-bold text-slate-900 mb-2">1. Dvůr a Pila: ${FARM.david.address}</p>
                <iframe title="Strunkovice 33" src="${FARM.david.mapEmbed}" class="w-full h-52 rounded-xl border border-slate-200" loading="lazy"></iframe>
              </div>
              <div class="bg-white p-5 rounded-2xl border border-slate-200">
                <p class="text-xs font-bold text-slate-900 mb-2">2. Políčko Rovná (${FARM.eva.gps}) u Rovné 68</p>
                <iframe title="Rovná GPS" src="${FARM.eva.mapEmbedField}" class="w-full h-52 rounded-xl border border-slate-200" loading="lazy"></iframe>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // LOGIKA PŘEPÍNÁNÍ 10 VIZUÁLNÍCH DESIGNŮ (?variant=1..10)
    // ============================================================================
    function getActiveIndex() {
      const params = new URLSearchParams(window.location.search);
      const v = params.get('variant');
      const idx = DESIGNS.findIndex(d => d.id === v);
      return idx >= 0 ? idx : 0;
    }

    function selectDesign(index) {
      const wrapped = (index + DESIGNS.length) % DESIGNS.length;
      const d = DESIGNS[wrapped];

      const url = new URL(window.location);
      url.searchParams.set('variant', d.id);
      window.history.replaceState({}, '', url);

      // Vykreslení vybraného designu
      const root = document.getElementById('design-root');
      root.innerHTML = d.isSidebarLayout ? renderSidebarDesign() : renderStandardDesign(d);

      // Aktualizace lišty
      document.getElementById('variant-name').textContent = `${d.id}/10: ${d.title}`;
      document.getElementById('state-banner-title').textContent = `Design ${d.id}/10: ${d.title} — ${d.subtitle}`;

      // Aktualizace číselných tlačítek 1..10
      const dots = document.getElementById('dots-container');
      dots.innerHTML = DESIGNS.map((item, i) => `
        <button
          type="button"
          onclick="selectDesign(${i})"
          class="w-6 h-6 rounded-md text-[11px] font-bold transition ${i === wrapped ? 'bg-emerald-500 text-stone-950 scale-110' : 'bg-stone-800 text-stone-400 hover:bg-stone-700 hover:text-white'}"
          title="${item.title}">
          ${item.id}
        </button>
      `).join('');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('prev-variant').addEventListener('click', () => selectDesign(getActiveIndex() - 1));
    document.getElementById('next-variant').addEventListener('click', () => selectDesign(getActiveIndex() + 1));

    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea' || document.activeElement?.isContentEditable) return;
      if (e.key === 'ArrowLeft') selectDesign(getActiveIndex() - 1);
      if (e.key === 'ArrowRight') selectDesign(getActiveIndex() + 1);
    });

    selectDesign(getActiveIndex());
  </script>
</body>
</html>
