    // ============================================================================
    // INTERAKTIVNÍ POMOCNÉ FUNKCE PRO VARIANTU 2 A VARIANTU 3
    // ============================================================================
    window.filterCatalog = function(cat) {
      document.querySelectorAll('.catalog-item').forEach(el => {
        el.style.display = (cat === 'all' || el.dataset.cat === cat) ? 'flex' : 'none';
      });
    };

    window.switchAppTab = function(tabId) {
      document.querySelectorAll('.app-tab-pane').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.app-tab-btn').forEach(btn => {
        btn.classList.remove('bg-emerald-600', 'text-white');
        btn.classList.add('text-stone-400');
      });
      const target = document.getElementById(tabId);
      const activeBtn = document.getElementById('btn-' + tabId);
      if (target) target.classList.remove('hidden');
      if (activeBtn) {
        activeBtn.classList.add('bg-emerald-600', 'text-white');
        activeBtn.classList.remove('text-stone-400');
      }
    };

    // ============================================================================
    // LOGIKA PŘEPÍNÁNÍ VARIANT (?variant=1..10 + Šipky klávesnice)
    // ============================================================================
    function getCurrentVariantIndex() {
      const params = new URLSearchParams(window.location.search);
      const v = params.get('variant');
      const idx = VARIANTS.findIndex(item => item.id === v);
      return idx >= 0 ? idx : 0;
    }

    function setVariantByIndex(index) {
      const wrapped = (index + VARIANTS.length) % VARIANTS.length;
      const chosen = VARIANTS[wrapped];

      // Aktualizace URL bez reloadu
      const url = new URL(window.location);
      url.searchParams.set('variant', chosen.id);
      window.history.replaceState({}, '', url);

      // Vykreslení
      document.getElementById('prototype-root').innerHTML = chosen.render();
      document.getElementById('variant-num').textContent = chosen.id;
      document.getElementById('variant-name').textContent = `${chosen.id}. ${chosen.name}`;
      document.getElementById('state-banner-title').textContent = `Varianta ${chosen.id}/10: ${chosen.name} — ${chosen.desc}`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('prev-variant').addEventListener('click', () => {
      setVariantByIndex(getCurrentVariantIndex() - 1);
    });

    document.getElementById('next-variant').addEventListener('click', () => {
      setVariantByIndex(getCurrentVariantIndex() + 1);
    });

    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea' || document.activeElement?.isContentEditable) return;
      if (e.key === 'ArrowLeft') setVariantByIndex(getCurrentVariantIndex() - 1);
      if (e.key === 'ArrowRight') setVariantByIndex(getCurrentVariantIndex() + 1);
    });

    // Inicializace při načtení
    setVariantByIndex(getCurrentVariantIndex());
  </script>
